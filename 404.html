<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- site-404 v1 (c13, X100). GitHub Pages serves this file (from the TOP of the repo) for any address on the domain that does not exist, at any depth. Every link is absolute (starts with /) because this page is shown at whatever address was typed. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%23222'/%3E%3Crect x='4' y='4' width='17' height='56' rx='3' fill='%23fff'/%3E%3Crect x='23' y='4' width='18' height='56' rx='3' fill='%23fff'/%3E%3Crect x='43' y='4' width='17' height='56' rx='3' fill='%23fff'/%3E%3Crect x='14' y='4' width='11' height='34' rx='2' fill='%23222'/%3E%3Crect x='39' y='4' width='11' height='34' rx='2' fill='%23222'/%3E%3C/svg%3E">
<style>
  :root { --bg:#27235a; --panel:#35307c; --edge:#1d1a45; --accent:#7b5cf0; --accent-edge:#5338c4; --card:#fbfaff; --card-edge:#cdc6f3; --ink:#2a2750; --bad:#e5534b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: #fff; font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  main { background: var(--card); color: var(--ink); border: 2px solid var(--card-edge); border-bottom: 8px solid var(--card-edge); border-radius: 18px; padding: 28px 30px 26px; max-width: 560px; width: 100%; text-align: center; }
  .code { font-size: clamp(64px, 18vw, 110px); font-weight: 800; line-height: 1; color: var(--bad); letter-spacing: 2px; }
  .code i { font-style: normal; display: inline-block; transform: rotate(-8deg); color: var(--accent); }
  h1 { margin: 8px 0 6px; font-size: 28px; }
  p { margin: 6px 0; color: #5b5788; }
  .path { display: inline-block; max-width: 100%; overflow-wrap: anywhere; background: #efecff; color: var(--ink); border-radius: 8px; padding: 2px 10px; font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }
  a.btn { font-weight: 700; text-decoration: none; color: #fff; background: var(--accent); border: 2px solid var(--accent-edge); border-bottom-width: 5px; border-radius: 12px; padding: 10px 20px; }
  a.btn.alt { background: #fff; color: var(--accent-edge); }
  a.btn:hover, a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a.btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  #near { display: none; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <div class="code">4<i>0</i>4</div>
  <h1>That page is not here</h1>
  <p>Nothing lives at <span class="path" id="path">this address</span>.</p>
  <p>It may have been typed a little differently, or moved.</p>
  <p id="near">Maybe you wanted <b id="nearName"></b>?</p>
  <div class="btns" id="btns"><a class="btn" href="/">Go to the home page</a></div>
</main>
<script>
(function () {
  var path = location.pathname + location.search;
  document.getElementById("path").textContent = path.length > 120 ? path.slice(0, 120) + "..." : path;
  function safeHref(h) { h = String(h || ""); return /^\/[^\/\\]/.test(h) ? h : null; }
  fetch("/nav.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (cfg) {
    var items = (cfg && cfg.items || []).filter(function (it) { return it.status !== "soon" && safeHref(it.href); });
    var btns = document.getElementById("btns");
    var lower = location.pathname.toLowerCase();
    items.forEach(function (it) {
      var a = document.createElement("a"); a.className = "btn alt"; a.href = safeHref(it.href); a.textContent = it.label; btns.appendChild(a);
      if (lower.indexOf(it.href.toLowerCase()) === 0 || lower + "/" === it.href.toLowerCase()) {
        document.getElementById("nearName").textContent = it.label; document.getElementById("near").style.display = "block";
      }
    });
  }).catch(function () {});
})();
</script>
</body>
</html>
