  /* ---- Canonical design tokens (Project-Instructions.md §3) ---- */
  :root {

  .gcard { position: relative; font: inherit; display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 14px; border: 0.5px solid var(--border-mid); --edge: var(--border-strong); box-shadow: 0 4px 0 var(--edge); margin-bottom: 4px; background: var(--bg-primary); color: var(--text-primary); cursor: pointer; font-size: 13px; font-weight: 500; transition: background .2s, opacity .25s, transform .07s, box-shadow .07s; }
  .gcard:hover { background: var(--bg-tertiary); }
  .gcard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .gcard.on { background: var(--g-accent); border-color: var(--g-accent); --edge: var(--g-accent-edge); color: #fff; }
  .gcard.idle:not(.on) { opacity: .5; }
  .gcard.add { background: var(--bg-primary); color: var(--text-tertiary); padding: 8px 12px; }
  .gicons { display: inline-flex; align-items: center; gap: 5px; font-size: 20px; color: var(--text-info); }
  .gcard.on .gicons { color: #fff; }
  .garrow { font-size: 14px; opacity: .8; }
  .fmtsvg { display: block; }
  .sdot { min-width: 18px; height: 18px; border-radius: 9px; font-size: 10.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; color: #fff; padding: 0 5px; }
  .sdot.learning { background: #2fb067; } .sdot.testing { background: #e9a31a; } .sdot.catchup { background: #e5534b; }
  .gear { font: inherit; border: 0.5px solid var(--border-mid); background: var(--bg-primary); color: var(--text-secondary); border-radius: 14px; padding: 6px 12px; font-size: 20px; cursor: pointer; display: inline-flex; align-items: center; }
  .gear:hover { background: var(--bg-tertiary); color: var(--text-info); }

  .hub-main { display: grid; grid-template-columns: minmax(200px, 250px) minmax(300px, 1fr); gap: 14px; align-items: start; }
  .lcol { display: flex; flex-direction: column; gap: 6px; }
  .slegend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 10.5px; color: var(--text-tertiary); padding: 0 2px 2px; }
  .slegend .sl { display: inline-flex; align-items: center; gap: 3px; }
  .lcard { display: flex; align-items: center; gap: 6px; background: var(--bg-primary); border: 0.5px solid var(--border-light); border-left: 6px solid var(--border-mid); border-radius: 12px; padding: 7px 8px; cursor: pointer; transition: background .2s, color .2s, border-color .2s, opacity .2s; min-height: 40px; }
  .lcard:hover { background: var(--bg-tertiary); }
  .lcard.st-learning { border-left-color: #2fb067; } .lcard.st-testing { border-left-color: #e9a31a; } .lcard.st-catchup { border-left-color: #e5534b; }
  .lcard.on { background: var(--g-accent); border-color: var(--g-accent); color: #fff; opacity: 1; box-shadow: 0 3px 0 var(--g-accent-edge); }
  .lcard.on:hover { background: var(--g-accent); }
  .lcard.isnew { background: #ffe9cf; border-color: #f0a24a; border-left-color: #f0a24a; }
  .lcard.isnew.on { background: #f08a24; border-color: #f08a24; box-shadow: 0 3px 0 #b86412; }
  .newtag { font-size: 9px; font-weight: 700; letter-spacing: .06em; background: #f08a24; color: #fff; border-radius: 6px; padding: 1px 5px; }
  .lcard.on .newtag { background: #fff; color: #b86412; }
  .lc-title { flex: 1 1 auto; font-size: 13.5px; font-weight: 500; min-width: 0; }
  .lc-tools { display: inline-flex; gap: 1px; opacity: 0; transition: opacity .15s; flex: 0 0 auto; }
  .lcard:hover .lc-tools, .lcard.on .lc-tools { opacity: 1; }
  .lc-btn { border: none; background: transparent; cursor: pointer; color: var(--text-tertiary); font-size: 13px; padding: 2px 4px; border-radius: 6px; display: inline-flex; align-items: center; }
  .lc-btn:hover { color: var(--text-info); background: var(--bg-info); }
  .lc-btn.big { font-size: 17px; padding: 4px 9px; border: 0.5px solid var(--border-mid); background: var(--bg-secondary); }
  .lcard.on .lc-btn { color: #fff; } .lcard.on .lc-btn:hover { background: rgba(255,255,255,.25); color: #fff; }
  .add-level-btn { border: 0.5px solid var(--border-mid); background: var(--bg-primary); border-radius: 12px; padding: 8px; font-size: 12px; color: var(--text-tertiary); cursor: pointer; font-family: var(--font-sans); }
  .add-level-btn:hover { background: var(--bg-tertiary); }
  body.student .lc-tools, body.student .gear, body.student .add-level-btn, body.student .gcard.add { display: none; }
  body.student .lc-state { pointer-events: none; }

  .stagecard { background: var(--g-bg); border-radius: 18px; padding: 10px; border-bottom: 6px solid var(--g-panel-edge); position: sticky; top: 0; max-width: calc((100vh - 190px) * 1.25 + 20px); }
  .maxbtn { position: absolute; z-index: 6; top: calc(var(--sc, 1) * 9px); right: calc(var(--sc, 1) * 9px); width: max(26px, calc(var(--sc, 1) * 38px)); height: max(24px, calc(var(--sc, 1) * 34px)); border-radius: 9px; border: 2px solid #5f58bd; border-bottom-width: 4px; background: var(--g-panel); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; opacity: .5; transition: opacity .2s, background .2s; }
  .maxbtn svg { width: 58%; height: 58%; }
  .maxbtn:hover, .maxbtn:focus-visible { background: #4b45a0; opacity: 1; }
  .preview-stage { position: relative; width: 100%; aspect-ratio: 800 / 640; overflow: hidden; border-radius: 14px; background: var(--g-bg); margin: 0 auto; }
  .preview-inner { position: absolute; left: 0; top: 0; width: 800px; height: 640px; transform-origin: 0 0; }
  .stagecard.demo .preview-inner { pointer-events: none; }
  .stagecard.max { position: fixed; inset: 0; z-index: 50; max-width: none; border-radius: 0; border-bottom: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 12px; }
  .stagecard.max .preview-stage { aspect-ratio: auto; flex: 0 0 auto; }
  .preview-over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(39,35,90,.42); z-index: 2; font-size: calc(var(--sc, 1) * 16px); }
  .over-card { display: flex; flex-direction: column; align-items: center; gap: 1.1em; }
  .modepick { display: flex; gap: .8em; }
  .mbtn { font: inherit; font-size: 1.2em; font-weight: 600; color: #fff; background: var(--g-panel); border: .12em solid #5f58bd; border-bottom-width: .3em; border-radius: .8em; padding: .5em 1em; display: flex; flex-direction: column; align-items: center; gap: .1em; cursor: pointer; transition: background .2s, transform .12s; }
  .mbtn i { font-size: 1.5em; }
  .mbtn:hover { background: #4b45a0; }
  .mbtn:active { transform: translateY(.1em); }
  .mbtn.on { background: var(--g-accent); border-color: var(--g-accent); border-bottom-color: var(--g-accent-edge); }
  .startbig { font: inherit; font-size: 2.2em; font-weight: 600; color: #fff; background: var(--g-good); border: .08em solid var(--g-good); border-bottom: .22em solid var(--g-good-edge); border-radius: .6em; padding: .3em 1.4em; cursor: pointer; display: inline-flex; align-items: center; gap: .3em; transition: filter .2s, opacity .2s, transform .12s; }
  .startbig:hover:not(:disabled) { filter: brightness(1.06); }
  .startbig:active:not(:disabled) { transform: translateY(.12em); border-bottom-width: .1em; }
  .startbig:disabled { opacity: .4; filter: grayscale(.7); cursor: not-allowed; }
  .pickhint { color: #e7e4ff; font-size: 1.05em; } .pickhint.warn { color: #ffd0cc; }
  .empty-note { color: #fff; font-size: 1.2em; }
  .scorechip { border-radius: 999px; }
  .scorechip.real { background: var(--bg-success); border-color: var(--border-success); color: var(--text-success); }
  .scorechip.test { background: var(--bg-yellow); border-color: var(--border-yellow); color: var(--text-yellow); }
  .chip { font-size: 10.5px; padding: 1px 8px; border-radius: 999px; background: var(--bg-secondary); border: 0.5px solid var(--border-mid); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; }
  .warnbox { display: flex; gap: 8px; align-items: flex-start; background: var(--bg-warning); border: 0.5px solid var(--border-warning); color: var(--text-warning); border-radius: var(--radius-md); padding: 8px 12px; font-size: 12px; margin-bottom: 10px; }

  /* the demo bot */
  .bot-cursor { position: absolute; left: 0; top: 0; z-index: 1; width: 30px; height: 30px; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); will-change: transform; }
  .bot-cursor svg { display: block; transition: transform .12s; transform-origin: 4px 2px; }
  .bot-cursor.press svg { transform: scale(.8); }
  .bot-ripple { position: absolute; z-index: 1; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid #fff; pointer-events: none; animation: ripple .6s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.4); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }

  /* ================= v6: the game, a fixed 800 x 640 design (scaled by the stage) ================= */
  .game { position: relative; width: 100%; height: 100%; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "hud" "prompt" "fb" "help" "ans"; grid-template-rows: 48px minmax(0, 1fr) 40px 40px 236px; gap: 8px; color: #fff; overflow: hidden; transition: grid-template-rows .22s ease; }
  .hud { display: flex; align-items: center; gap: 8px; min-width: 0; position: relative; z-index: 5; padding-right: 48px; }
  .hud-btn { font: inherit; font-size: 14px; color: #fff; background: var(--g-panel); border: 2px solid #4b45a0; border-bottom-width: 4px; border-radius: 12px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .hud-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .hud-title { background: var(--g-accent); border-bottom: 4px solid var(--g-accent-edge); color: #fff; font-size: 20px; font-weight: 500; padding: 4px 14px; border-radius: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .hud-chip, .hud-mode { background: var(--g-panel); border-radius: 12px; padding: 5px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .hud-chip.real { background: #1f6e44; }
  .hud-stats { display: flex; gap: 6px; align-items: stretch; }
  .hud-stat { background: var(--g-panel); border-radius: 12px; padding: 2px 12px; text-align: center; width: 78px; display: flex; flex-direction: column; justify-content: center; height: 44px; }
  .hud-stat b { display: block; font-size: 20px; font-weight: 500; line-height: 1.1; }
  .hud-stat span { font-size: 9.5px; opacity: .7; text-transform: uppercase; letter-spacing: .08em; }
  .hud-stat.hearts { flex-direction: row; align-items: center; width: auto; padding: 2px 10px; }
  .hud-stat .hearts-row { display: inline-flex; gap: 3px; opacity: 1; text-transform: none; letter-spacing: 0; font-size: 26px; }
  .hud-stat .heart { font-size: 26px; opacity: 1; letter-spacing: 0; text-transform: none; }
  .heart { position: relative; display: inline-block; width: 26px; height: 30px; text-align: center; font-size: 26px; line-height: 30px; color: #ff6b6b; }
  .heart .hh { font-style: normal; }
  .heart.lost .hh { color: rgba(255,255,255,.45); }
  .heart .fall { position: absolute; left: 0; right: 0; top: 0; font-style: normal; color: #ff6b6b; pointer-events: none; animation: heartfall .95s cubic-bezier(.5, 0, 1, .6) forwards; }
  @keyframes heartfall { 0% { transform: translateY(0) scale(1); opacity: 1; } 18% { transform: translateY(-8px) scale(1.3) rotate(-10deg); opacity: 1; } 100% { transform: translateY(120px) scale(.8) rotate(28deg); opacity: 0; } }

  .prompt-card { min-height: 0; overflow: hidden; background: var(--g-card); color: var(--g-ink); border-radius: 22px; border-bottom: 7px solid var(--g-card-edge); display: flex; align-items: center; justify-content: center; padding: 6px 14px; min-width: 0; transition: opacity .25s, background .3s, box-shadow .3s, border-color .3s; }
  .prompt-card.pending, .answer-panel.pending, .helpers.pending { opacity: 0; }
  .prompt-card.good { background: #eaf9f0; border-bottom-color: var(--g-good); box-shadow: inset 0 0 0 4px var(--g-good); }
  .prompt-card.bad { background: #fdeceb; border-bottom-color: var(--g-bad); box-shadow: inset 0 0 0 4px var(--g-bad); animation: shake .4s; }
  .prompt-name-big { font-size: 118px; line-height: 1; font-weight: 500; color: var(--g-ink); }
  .staff-host { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
  .staff-host svg { height: 100%; width: auto; max-width: 100%; }
  .feedback { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .fb-pill { display: inline-flex; align-items: center; gap: 10px; padding: 4px 20px 4px 5px; border-radius: 999px; font-size: 18px; font-weight: 500; color: #fff; border-bottom: 4px solid transparent; animation: pop .3s ease-out; white-space: nowrap; }
  .fb-pill .fb-ico { width: 28px; height: 28px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; line-height: 1; }
  .fb-pill.correct { background: var(--g-good); border-bottom-color: var(--g-good-edge); }
  .fb-pill.correct .fb-ico { color: var(--g-good-edge); }
  .fb-pill.incorrect { background: var(--g-bad); border-bottom-color: var(--g-bad-edge); }
  .fb-pill.incorrect .fb-ico { color: var(--g-bad-edge); }
  .fb-pill.neutral { background: var(--g-panel); border-bottom-color: var(--g-panel-edge); padding-left: 20px; }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  .helpers { position: relative; display: flex; align-items: flex-start; gap: 8px; min-width: 0; min-height: 0; overflow: hidden; transition: opacity .25s; }
  .hcards { position: relative; flex: 1 1 0; min-width: 0; height: 100%; overflow: hidden; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .hcard { background: var(--g-panel); border-bottom: 4px solid var(--g-panel-edge); border-radius: 12px; padding: 3px 10px; height: 33px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #fff; white-space: nowrap; }
  .hcard.txt { white-space: normal; height: 33px; overflow: hidden; line-height: 1.1; max-width: 100%; }
  .hcard b { font-weight: 500; color: #d9d5ff; }
  .hl { display: inline-block; min-width: 20px; text-align: center; padding: 1px 4px; border-radius: 7px; background: rgba(255,255,255,.12); font-weight: 500; }
  .hl.now { background: var(--g-accent); }
  .hbtn { font: inherit; font-size: 13px; color: #fff; background: var(--g-accent); border: 2px solid var(--g-accent); border-bottom: 4px solid var(--g-accent-edge); border-radius: 9px; padding: 0 10px; cursor: pointer; }
  .hbtn.ok { background: var(--g-good); border-color: var(--g-good); border-bottom-color: var(--g-good-edge); }
  .hbtn.no { background: var(--g-bad); border-color: var(--g-bad); border-bottom-color: var(--g-bad-edge); }
  .hres { color: #fff; font-weight: 500; }
  .hchip { background: rgba(255,255,255,.1); color: #d9d5ff; border-radius: 999px; padding: 0 12px; height: 28px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .helpwrap { position: relative; flex: 0 0 auto; margin-left: auto; }
  .helpbtn { font: inherit; font-size: 14px; color: #fff; background: #4b45a0; border: 2px solid #5f58bd; border-bottom-width: 4px; border-radius: 12px; padding: 4px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .helpbtn.on { background: var(--g-accent); }
  .helpmenu { position: absolute; right: 0; bottom: 112%; background: var(--g-panel); border: 2px solid #5f58bd; border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 250px; z-index: 8; animation: pop .2s ease-out; }
  .hmitem { font: inherit; font-size: 14px; color: #fff; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .hmitem:hover { background: rgba(255,255,255,.1); }
  .hmitem.on { background: var(--g-accent); }
  .hmitem.show { color: #ffd9d6; border-top: 1px solid rgba(255,255,255,.15); border-radius: 0 0 10px 10px; margin-top: 2px; }
  .coach { width: 100%; height: 100%; background: var(--g-panel); border-bottom: 5px solid var(--g-panel-edge); border-radius: 16px; padding: 6px 12px; display: flex; gap: 10px; align-items: center; }
  .coach-dots { display: flex; flex-direction: column; gap: 3px; flex: 0 0 auto; }
  .coach-dots { flex-direction: row; flex-wrap: wrap; width: 62px; }
  .cd { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.14); font-size: 10px; display: inline-flex; align-items: center; justify-content: center; transition: background .3s; }
  .cd.done { background: var(--g-good); } .cd.now { background: #fff; color: var(--g-accent-edge); font-weight: 700; }
  .coach-now { flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1.22; max-height: 56px; overflow: hidden; color: #fff; }
  .coach-now b { font-weight: 500; } .coach-now .tx { color: #d9d5ff; }
  .coach-btn { font: inherit; font-size: 14px; color: #fff; background: var(--g-accent); border: 2px solid var(--g-accent); border-bottom: 5px solid var(--g-accent-edge); border-radius: 12px; padding: 5px 14px; cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
  .coach-btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  .coach-btn.go { background: var(--g-good); border-color: var(--g-good); border-bottom-color: var(--g-good-edge); }

  .answer-panel { min-height: 0; overflow: hidden; background: var(--g-panel); border-bottom: 6px solid var(--g-panel-edge); border-radius: 22px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; justify-content: center; transition: opacity .25s; }
  .answer-panel.gated { opacity: .45; pointer-events: none; }
  .name-rows { flex: 1 1 auto; min-height: 0; display: grid; grid-auto-rows: 1fr; gap: 8px; }
  .name-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; min-height: 0; }
  .name-btn { --bc: #4f8cff; --bg: #dce8ff; --tx: #12306b; --edge: #2f67d8; position: relative; font-family: var(--font-sans); font-size: 30px; font-weight: 500; color: var(--tx); background: var(--bg); border: 2px solid var(--bc); border-bottom: 6px solid var(--edge); border-radius: 14px; padding: 0; cursor: pointer; min-height: 0; transition: opacity .25s, background .25s, border-color .25s, transform .1s; }
  .name-btn.r-sharps { --bc: #ff8a5b; --bg: #ffe6d9; --tx: #5a2a12; --edge: #d96a3b; }
  .name-btn.r-flats { --bc: #2ec4a6; --bg: #d9f6ee; --tx: #0d4a3d; --edge: #1a9c82; }
  .name-btn:hover:not(:disabled) { filter: brightness(.97); }
  .name-btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
  .name-btn.grey, .name-btn.grey:hover { background: transparent; border: 2px dashed rgba(255,255,255,.16); border-bottom-width: 2px; color: rgba(255,255,255,.2); cursor: not-allowed; box-shadow: none; }
  .name-btn.locked { pointer-events: none; }
  .name-btn.dim { opacity: .4; }
  .name-btn.right, .name-btn.wrong { color: #fff; opacity: 1; z-index: 1; }
  .name-btn.right { background: var(--g-good); border-color: var(--g-good-edge); border-bottom-color: var(--g-good-edge); animation: pop .35s ease-out; }
  .name-btn.wrong { background: var(--g-bad); border-color: var(--g-bad-edge); border-bottom-color: var(--g-bad-edge); animation: shake .4s; }
  .name-btn.wrong-dim { opacity: .5; pointer-events: none; }
  .name-btn.right::after, .name-btn.wrong::after { position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .name-btn.right::after { content: "\2713"; color: var(--g-good-edge); }
  .name-btn.wrong::after { content: "\2715"; color: var(--g-bad-edge); }
  .name-btn.picked { background: #4f8cff; border-color: #2f67d8; border-bottom-color: #1f4fb0; color: #fff; opacity: 1; }
  .name-btn.picked::after { content: "1"; position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #2f67d8; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  .piano-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .piano-svg { height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: hidden; }
  .piano-key { cursor: pointer; transition: fill .25s, stroke .25s, fill-opacity .25s; }
  .piano-key.white { fill: #ffffff; stroke: #6d68a8; stroke-width: 1.2; }
  .piano-key.white:hover { fill: #efeaff; }
  .piano-key.black { fill: #2a2750; stroke: #1d1a45; }
  .piano-key.black:hover { fill: #46408a; }
  .piano-key.target { fill: #7b5cf0 !important; stroke: #5338c4 !important; }
  .piano-key.grey { cursor: not-allowed; pointer-events: none; stroke-dasharray: 3 3; }
  .piano-key.white.grey { fill: #5b57a0; fill-opacity: .5; stroke: #9a96d8; }
  .piano-key.black.grey { fill: #3f3b8a; fill-opacity: .6; stroke: #9a96d8; }

  /* ================= v7 ================= */

  /* game bar groups */

  /* level cards: status icon, big number, one-word skill, what's new */

  .lcard.st-future .lc-state { background: transparent; color: var(--c); border: 2px dashed var(--c); box-shadow: none; }

  .lcard .lc-tools { opacity: .5; }

  /* start above the modes; nothing moves when a mode is chosen */

  /* the game: areas, helper row of 0 / 1 / 2 lines */
  .hud { grid-area: hud; } .prompt-card { grid-area: prompt; } .fbwrap { grid-area: fb; position: relative; display: flex; min-width: 0; }
  .fbwrap .feedback { flex: 1 1 auto; min-width: 0; }

  .helpbtn { flex: 0 0 auto; height: 34px; padding: 0 14px; }
  .hchipbtn { font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,.1); border: 1.5px dashed rgba(255,255,255,.4); border-radius: 999px; padding: 0 12px; height: 32px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

  /* note states in the level editor */

  /* helpers editor */
  .chcard { border: 0.5px solid var(--border-light); background: var(--bg-tertiary); border-radius: 10px; padding: 8px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 6px; }

  /* ================= v8 ================= */
  /* game bar: one small dot per level (colour = its status) instead of counts */
  .gdot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); border: 2px solid #fff; box-sizing: border-box; flex: 0 0 auto; }
  .gcard:not(.on) .gdot { border-color: var(--bg-primary); }
  .gdot[data-tip]:hover::after { left: auto; right: 0; }
  .gamebar .gear { margin-bottom: 4px; }
  .gcard { min-height: 38px; }
  /* level cards: the status colour bar on the left, a 1px white hairline, then the card (same when selected) */
  .lcard { display: block; padding: 0 0 0 10px; background: var(--c, #9a9aa8); border: 0; border-radius: 12px; min-height: 0; box-shadow: none; opacity: 1; transition: opacity .2s; }
  .lcard:hover, .lcard.on:hover { background: var(--c, #9a9aa8); }

  .lcard .lc-in { display: flex; align-items: center; gap: 9px; min-height: 54px; padding: 7px 8px; background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: 8px 12px 12px 8px; box-shadow: -1px 0 0 #fff; color: var(--text-primary); transition: background .2s, color .2s; }

  .lcard.isnew.on .lc-in { background: #f08a24; border-color: #f08a24; box-shadow: -1px 0 0 #fff; }
  /* the thick edge runs under the WHOLE selected card (status bar + hairline + body), not only under the body */
  .lcard.on, .lcard.isnew.on { box-shadow: 0 3px 0 var(--g-accent-edge); }
  .lcard.isnew.on { box-shadow: 0 3px 0 #b86412; }

  .lcard.on { margin-bottom: 3px; }
  .lc-state, .lcard.on .lc-state { background: #fff; color: var(--c); border: 3px solid var(--c); box-shadow: none; }
  .lcard.st-future .lc-state, .lcard.st-future.on .lc-state { background: #fff; color: var(--c); border: 3px dashed var(--c); }
  .lcard { position: relative; }
  .lcard.drop-above::before, .lcard.drop-below::after { content: ""; position: absolute; left: 2px; right: 2px; height: 4px; border-radius: 2px; background: var(--g-accent); z-index: 3; pointer-events: none; }
  .lcard.drop-above::before { top: -5px; }
  .lcard.drop-below::after { bottom: -5px; }
  .lcard.lifted { opacity: .5; }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  .lgrip { align-self: stretch; display: flex; align-items: center; justify-content: center; width: 20px; margin: -7px 0 -7px -8px; border-radius: 8px 0 0 8px; cursor: grab; color: var(--text-tertiary); opacity: .5; flex: 0 0 auto; transition: opacity .15s, background .15s; }

  .lcard.on .lgrip { color: #fff; } .lcard.on .lgrip:hover { background: rgba(255,255,255,.22); }
  body.student .lgrip { display: none; }
  /* undo chip */
  .undochip { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 400; background: #27235a; color: #fff; border-radius: 999px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; border-bottom: 3px solid #1d1a45; }

  /* score chip: small and out of the way; the menu opens from it */

  .scorechip:hover { filter: brightness(.96); }
  .scorechip:active { transform: scale(.98); }
  body.student #scoreChipWrap { display: none; }

  .kindchip { cursor: pointer; font: inherit; font-size: 11px; }
  .hdel { opacity: .55; } .hdel:hover { opacity: 1; }
